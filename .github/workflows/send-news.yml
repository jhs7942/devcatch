name: 개발 뉴스 알림

on:
    schedule:
        - cron: '17 0,9 * * 1-5'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: devcatch-send-news
    cancel-in-progress: false

jobs:
    send-news:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npm run typecheck
            - run: npm test

            - run: npm run run
              env:
                  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

            - name: 발송 이력과 임베딩 캐시 저장
              if: ${{ !cancelled() }}
              run: |
                  git add -- data/sent-articles.json data/embeddings.json
                  if git diff --cached --quiet -- data/sent-articles.json data/embeddings.json; then
                    echo "발송 이력 변경 없음"
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "chore: 뉴스 발송 이력 및 임베딩 캐시 업데이트 [skip ci]"
                  git push
