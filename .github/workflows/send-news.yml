name: 개발 뉴스 알림

on:
    schedule:
        - cron: '17 0,9 * * 1-5'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: devcatch-send-news
    cancel-in-progress: false

jobs:
    send-news:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npm run run
              env:
                  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

            - name: 발송 이력 저장
              run: |
                  if git diff --quiet -- data/sent-articles.json; then
                    echo "발송 이력 변경 없음"
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/sent-articles.json
                  git commit -m "chore: 뉴스 발송 이력 업데이트 [skip ci]"
                  git push
